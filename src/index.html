<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div id="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <title>weather-cloudy</title>
          <path
            d="M6,19A5,5 0 0,1 1,14A5,5 0 0,1 6,9C7,6.65 9.3,5 12,5C15.43,5 18.24,7.66 18.5,11.03L19,11A4,4 0 0,1 23,15A4,4 0 0,1 19,19H6M19,13H17V12A5,5 0 0,0 12,7C9.5,7 7.45,8.82 7.06,11.19C6.73,11.07 6.37,11 6,11A3,3 0 0,0 3,14A3,3 0 0,0 6,17H19A2,2 0 0,0 21,15A2,2 0 0,0 19,13Z"
          />
        </svg>
        Weather App
      </div>
      <div id="search-bar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <title>Search</title>
          <path
            d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"
          />
        </svg>
        <form>
          <input
            type="text"
            id="city"
            placeholder="Search for a city..."
            autocomplete="false"
          />
        </form>
      </div>
    </header>
    <main>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
      </div>
      <div id="error" class="error hidden"></div>
      <div id="main-panel">
        <div id="city-placeholder">
          <div id="city">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <title>map-marker</title>
              <path
                d="M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2Z"
              />
            </svg>
            <span></span>
          </div>
          <div id="unit-toggle">
            <button id="celsius">°C</button>
            <span>|</span>
            <button id="farenheit">°F</button>
          </div>
        </div>
        <div id="weather-placeholder">
          <span>0°</span>
          <img id="weather-icon" alt="Weather" />
        </div>
        <div id="min-max-placeholder">
          <div id="max-placeholder">
            <div id="max">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <title>arrow-up-thin</title>
                <path
                  d="M7.03 9.97H11.03V18.89L13.04 18.92V9.97H17.03L12.03 4.97Z"
                  fill="currentColor"
                />
              </svg>
              <span>0°</span>
            </div>
            <p>High</p>
          </div>
          <div id="min-placeholder">
            <div id="min">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <title>arrow-down-thin</title>
                <path
                  d="M7.03 13.92H11.03V5L13.04 4.97V13.92H17.03L12.03 18.92Z"
                  fill="currentColor"
                />
              </svg>
              <span>°</span>
            </div>
            <p>Low</p>
          </div>
        </div>
      </div>
      <div id="details-panel">
        <h2>Wheater Details</h2>
        <div id="weather-info">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>thermometer</title>
            <path
              d="M15 13V5A3 3 0 0 0 9 5V13A5 5 0 1 0 15 13M12 4A1 1 0 0 1 13 5V8H11V5A1 1 0 0 1 12 4Z"
            />
          </svg>
          <span>Feels like</span>
          <span id="feels-like">32°</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>water</title>
            <path
              d="M12,20A6,6 0 0,1 6,14C6,10 12,3.25 12,3.25C12,3.25 18,10 18,14A6,6 0 0,1 12,20Z"
            />
          </svg>
          <span>Humidity</span>
          <span id="humidity">35%</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>weather-windy</title>
            <path
              d="M4,10A1,1 0 0,1 3,9A1,1 0 0,1 4,8H12A2,2 0 0,0 14,6A2,2 0 0,0 12,4C11.45,4 10.95,4.22 10.59,4.59C10.2,5 9.56,5 9.17,4.59C8.78,4.2 8.78,3.56 9.17,3.17C9.9,2.45 10.9,2 12,2A4,4 0 0,1 16,6A4,4 0 0,1 12,10H4M19,12A1,1 0 0,0 20,11A1,1 0 0,0 19,10C18.72,10 18.47,10.11 18.29,10.29C17.9,10.68 17.27,10.68 16.88,10.29C16.5,9.9 16.5,9.27 16.88,8.88C17.42,8.34 18.17,8 19,8A3,3 0 0,1 22,11A3,3 0 0,1 19,14H5A1,1 0 0,1 4,13A1,1 0 0,1 5,12H19M18,18H4A1,1 0 0,1 3,17A1,1 0 0,1 4,16H18A3,3 0 0,1 21,19A3,3 0 0,1 18,22C17.17,22 16.42,21.66 15.88,21.12C15.5,20.73 15.5,20.1 15.88,19.71C16.27,19.32 16.9,19.32 17.29,19.71C17.47,19.89 17.72,20 18,20A1,1 0 0,0 19,19A1,1 0 0,0 18,18Z"
            />
          </svg>
          <span>Wind</span>
          <span id="wind">14 km/h</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>eye-outline</title>
            <path
              d="M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M12,4.5C17,4.5 21.27,7.61 23,12C21.27,16.39 17,19.5 12,19.5C7,19.5 2.73,16.39 1,12C2.73,7.61 7,4.5 12,4.5M3.18,12C4.83,15.36 8.24,17.5 12,17.5C15.76,17.5 19.17,15.36 20.82,12C19.17,8.64 15.76,6.5 12,6.5C8.24,6.5 4.83,8.64 3.18,12Z"
            />
          </svg>
          <span>Visibility</span>
          <span id="visibility">16 km</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>clock-outline</title>
            <path
              d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"
            />
          </svg>
          <span>Pressure</span>
          <span id="pressure">1012 hPa</span>
        </div>
      </div>
      <!-- <div id="hourly-panel">
        <h2>Hourly Forecast</h2>
      </div>
      <div id="daily-panel">
        <h2>5-Day Forecast</h2>
      </div> -->
    </main>
  </body>
</html>
